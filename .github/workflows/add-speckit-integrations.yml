name: Add Spec Kit Integrations

on:
  push:
    branches:
      - main
      - 001-local-notebook-launcher
    paths:
      - .github/workflows/add-speckit-integrations.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Add Claude Code integration
        run: |
          uvx --from git+https://github.com/github/spec-kit.git specify integration install claude --script sh

      - name: Add Gemini CLI integration
        run: |
          uvx --from git+https://github.com/github/spec-kit.git specify integration install gemini --script sh

      - name: Verify integrations
        run: |
          uvx --from git+https://github.com/github/spec-kit.git specify integration status
          cat .specify/integration.json

      - name: Commit generated integration scaffolds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specify .claude .gemini
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: add Claude and Gemini Spec Kit integrations"
            git push
          fi
