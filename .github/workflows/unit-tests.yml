name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main
      - "002-*"
      - "003-*"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: ruff check --select F src tests
      - name: Test suite
        run: pytest -q --cov=notebook_launcher --cov-report=term-missing
