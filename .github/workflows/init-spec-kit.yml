name: Initialize Spec Kit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/init-spec-kit.yml

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Initialize Spec Kit for Codex
        run: |
          uvx --from git+https://github.com/github/spec-kit.git specify init --here --force --integration codex --script sh --ignore-agent-tools

      - name: Commit generated Spec Kit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specify .agents
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: initialize Spec Kit"
            git push
          fi
