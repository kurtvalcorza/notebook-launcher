openapi: 3.1.0
info:
  title: Notebook Launcher Local API
  version: 0.3.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /open:
    get:
      summary: Start a remote-source launch or reopen a persistent workspace
      description: Remote source uses url or repo/ref/path. Existing work uses workspace_id. New untrusted remote sources may redirect to a local trust-confirmation state before execution.
      parameters:
        - name: url
          in: query
          schema: { type: string, format: uri }
        - name: repo
          in: query
          schema: { type: string, pattern: '^[^/]+/[^/]+$' }
        - name: ref
          in: query
          schema: { type: string }
        - name: path
          in: query
          schema: { type: string }
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
        - name: gpu
          in: query
          schema: { type: string, enum: [auto, on, off], default: auto }
        - name: agent_mode
          in: query
          schema: { type: string, enum: [write, readonly], default: write }
      responses:
        '303': { description: Launch accepted; redirect to status/trust page }
        '400': { description: Invalid or unsafe request }
        '404': { description: Unknown workspace/source }
        '422': { description: Conflicting or incomplete parameters }
  /api/launches/{launch_id}:
    get:
      summary: Get launch state
      parameters:
        - $ref: '#/components/parameters/LaunchId'
      responses:
        '200':
          description: Launch state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchStatus' }
        '404': { description: Unknown launch }
  /api/launches/{launch_id}/trust:
    post:
      summary: Approve or deny execution of a pending remote source
      parameters:
        - $ref: '#/components/parameters/LaunchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [trust, deny] }
                remember_scope: { type: string, enum: [revision, repository], default: revision }
      responses:
        '200': { description: Decision recorded }
        '409': { description: Launch is not awaiting trust }
  /api/workspaces/{workspace_id}:
    get:
      summary: Get persistent workspace metadata
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '404': { description: Unknown workspace }
  /api/workspaces/{workspace_id}/notebooks/copy:
    post:
      summary: Save a copy of a notebook within persistent local storage
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotebookCopyRequest' }
      responses:
        '201': { description: Notebook copy created }
        '400': { description: Invalid/traversing destination }
        '409': { description: Destination exists and overwrite=false }
  /api/sessions/{session_id}/mcp:
    get:
      summary: Get non-secret MCP attachment descriptor
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Attachment descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpAttachment' }
        '404': { description: Unknown session }
        '409': { description: Session not ready }
        '410': { description: Session stopped/invalidated }
  /api/sessions/{session_id}:
    delete:
      summary: Stop disposable runtime while preserving workspace/cache
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Runtime stopped; workspace preserved }
        '404': { description: Unknown session }
  /health:
    get:
      summary: Launcher health
      responses:
        '200': { description: Service running }
components:
  parameters:
    LaunchId:
      name: launch_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LaunchStatus:
      type: object
      required: [id, phase, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        phase:
          type: string
          enum: [received, resolving, awaiting_trust, acquiring, workspace_preparing, building, cache_hit, starting, mcp_preparing, ready, failed, stopping, stopped]
        message: { type: [string, 'null'] }
        error_code: { type: [string, 'null'] }
        commit_sha: { type: [string, 'null'] }
        workspace_id: { type: [string, 'null'], format: uuid }
        notebook_path: { type: [string, 'null'] }
        session_id: { type: [string, 'null'], format: uuid }
        ready_url: { type: [string, 'null'], format: uri }
        gpu_enabled: { type: [boolean, 'null'] }
        agent_mode: { type: [string, 'null'], enum: [write, readonly, null] }
        mcp_available: { type: [boolean, 'null'] }
        mcp_status: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Workspace:
      type: object
      required: [id, commit_sha, active_notebook_path, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        repository: { type: string }
        commit_sha: { type: string }
        active_notebook_path: { type: string }
        outputs_path: { type: string }
        user_data_mounted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotebookCopyRequest:
      type: object
      required: [source_path, destination_scope, destination_path]
      properties:
        source_path: { type: string }
        destination_scope: { type: string, enum: [workspace, user_data] }
        destination_path: { type: string }
        include_outputs: { type: boolean, default: true }
        overwrite: { type: boolean, default: false }
    McpAttachment:
      type: object
      required: [session_id, available, status, transport, agent_mode, capabilities]
      properties:
        session_id: { type: string, format: uuid }
        available: { type: boolean }
        status: { type: string, enum: [unavailable, available, attaching, attached, error, invalidated] }
        transport: { type: string, examples: [stdio] }
        command: { type: [string, 'null'], examples: [notebook-launcher] }
        args:
          type: array
          items: { type: string }
        backend: { type: [string, 'null'] }
        agent_mode: { type: string, enum: [write, readonly] }
        capabilities:
          type: array
          items: { type: string }
        missing_required_capabilities:
          type: array
          items: { type: string }
        message: { type: [string, 'null'] }
